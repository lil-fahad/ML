[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novaforge-ai"
version = "0.3.0"
description = "Browser-first evidence collection fused with adaptive safe PyTorch model training"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14", "duckdb>=0.10"]
browser = ["playwright>=1.45", "trafilatura>=1.8", "beautifulsoup4>=4.12", "xxhash>=3.4"]
test = ["pytest>=8"]
all = ["pandas>=2.0", "pyarrow>=14", "duckdb>=0.10", "playwright>=1.45", "trafilatura>=1.8", "beautifulsoup4>=4.12", "xxhash>=3.4", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["novaforge*"]
